<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="#0e1424" />
  <rect x="24" y="24" width="464" height="464" rx="108" fill="#141b2d" stroke="#f97316" stroke-width="6" stroke-opacity="0.4"/>
  
  <!-- Food Icon Center Circle with Gradient -->
  <circle cx="256" cy="256" r="160" fill="url(#grad)" filter="url(#shadow)" />
  
  <!-- Utensils Cross Fork & Knife in White -->
  <g fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <!-- Knife -->
    <path d="M190 340 L320 170" />
    <path d="M320 170 C345 145 365 170 345 190 L220 315" />
    <!-- Fork -->
    <path d="M320 340 L190 170" />
    <path d="M165 195 L215 145" />
    <path d="M180 180 L160 200" />
  </g>
</svg>
