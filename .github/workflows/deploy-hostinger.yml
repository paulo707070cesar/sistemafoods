name: Deploy para Hostinger via GitHub

# Publica apenas a interface estática (dist/) na hospedagem compartilhada.
# A API Node (server.js + server/ + shared/) NÃO é enviada por FTP e precisa de
# hospedagem com suporte a Node.js (VPS, Cloud ou Node.js no hPanel).
# Sem a API, o aplicativo funciona em modo local e o Acesso Remoto fica indisponível.

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Instalar Dependências
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: 🔨 Compilar Versão de Produção
        run: npm run build

      - name: 📦 Disponibilizar build para download
        uses: actions/upload-artifact@v4
        with:
          name: sistemafoods-dist
          path: dist/
          retention-days: 7

      - name: ⚠️ Conferir segredos de FTP
        env:
          FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: |
          faltando=""
          [ -z "$FTP_SERVER" ] && faltando="$faltando HOSTINGER_FTP_SERVER"
          [ -z "$FTP_USERNAME" ] && faltando="$faltando HOSTINGER_FTP_USERNAME"
          [ -z "$FTP_PASSWORD" ] && faltando="$faltando HOSTINGER_FTP_PASSWORD"
          if [ -n "$faltando" ]; then
            echo "::error::Segredos ausentes:$faltando"
            echo "Configure em Settings > Secrets and variables > Actions do repositório."
            echo "Sem eles nada é publicado e o deploy fica silenciosamente sem efeito."
            exit 1
          fi
          echo "Segredos de FTP presentes."

      - name: 🚀 Publicar na Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./public_html/
          dangerous-clean-slate: false
