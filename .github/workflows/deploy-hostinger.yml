name: Deploy para Hostinger via GitHub

# Publica apenas a interface estática (dist/) na hospedagem compartilhada.
# A API Node (server.js + server/ + shared/) NÃO é enviada por FTP e precisa de
# hospedagem com suporte a Node.js (VPS, Cloud ou Node.js no hPanel).
# Sem a API, o aplicativo funciona em modo local e o Acesso Remoto fica indisponível.

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Instalar Dependências
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: 🔨 Compilar Versão de Produção
        run: npm run build

      - name: 📦 Disponibilizar build para download
        uses: actions/upload-artifact@v4
        with:
          name: sistemafoods-dist
          path: dist/
          retention-days: 7

      - name: 🚀 Publicar na Hostinger via FTP
        if: env.HOSTINGER_FTP_SERVER != ''
        env:
          HOSTINGER_FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./public_html/
          dangerous-clean-slate: false
