# Proxy reverso para o Sistema Food em VPS/Cloud.
# Copie para /etc/nginx/sites-available/sistema-food e ajuste o server_name.
#
# Depois:
#   sudo ln -s /etc/nginx/sites-available/sistema-food /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d seudominio.com.br

server {
    listen 80;
    listen [::]:80;
    server_name seudominio.com.br;

    # Redireciona tudo para HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name seudominio.com.br;

    # O certbot preenche estes caminhos automaticamente.
    ssl_certificate     /etc/letsencrypt/live/seudominio.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seudominio.com.br/privkey.pem;

    # Tamanho de payload compatível com o limite da API.
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Necessário para os eventos em tempo real (SSE) funcionarem.
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        chunked_transfer_encoding off;
    }
}
